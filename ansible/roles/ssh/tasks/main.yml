- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Copy SSH config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/ssh/config"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    mode: "0644"
    force: false
